services:
  mongodb:
    image: mongo:7
    container_name: vedaai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./.data/mongodb:/data/db

  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
